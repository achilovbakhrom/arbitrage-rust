[package]
name = "rust-arb-optimized"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "target-feature=+neon,+fp16,+crypto", "-C", "opt-level=3", "-C", "lto=fat"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-C", "target-feature=+avx,+avx2,+sse4.2", "-C", "opt-level=3"]

[dependencies]
async-trait = "0.1.88"
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.27.0", features = ["native-tls"] }
tungstenite = "0.27.0"
colored = "3.0"
dotenv = "0.15"
anyhow = "1.0.98"
thiserror = "2.0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12.15", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
rand = "0.9.1"
lazy_static = "1.5.0"
byteorder = "1.5.0"
bytes = "1.5.0"
http = "1.3.1"
url = "2.5.4"
parking_lot = "0.12.4"
crossbeam = "0.8.4"
ctrlc = "3.4.7"
rpmalloc = "0.2.2"
native-tls = "0.2.14"
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
crossbeam-channel = "0.5.15"
string_cache = "0.8.9"
ahash = "0.8.12"
rustc-hash = "2.1.1"
figlet-rs = "0.1.5"